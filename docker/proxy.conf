# DNS interno do Docker — necessário porque proxy_pass usa uma VARIÁVEL
# ($upstream_app), o que faz o nginx resolver o host em tempo de request
# (não no boot). Sem isso, trocar de slot exigiria recriar o proxy.
resolver 127.0.0.11 valid=10s;

# Preserva o X-Forwarded-Proto que o cloudflared já manda certo (https) em
# vez de sobrescrever com $scheme (que aqui dentro é sempre "http" — a
# conexão cloudflared->proxy não tem TLS, o Cloudflare já terminou TLS
# antes). Bug real que já quebrou o Alvará (CSP bloqueando tudo porque o
# app achava que a requisição era HTTP) — feito certo aqui desde o início.
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # 3002, não 80: instâncias já registradas nos providers (Evolution/WuzAPI)
    # guardam a URL de webhook como http://app:3002/... — o proxy PRECISA
    # responder nessa porta pra elas continuarem funcionando sem re-registrar
    # nada (ver alias "app" no docker-compose.yml, que faz esse hostname
    # antigo apontar pro proxy também).
    listen 3002;
    server_name _;
    client_max_body_size 20m;

    # Escrito pelo proxy-entrypoint.sh na primeira subida, e reescrito pelo
    # job de deploy a cada troca de slot (blue<->green) + `nginx -s reload`.
    include /etc/nginx/active/upstream.conf;

    location / {
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 60s;
    }
}
