# Arquivo baked na imagem (COPY no Dockerfile.proxy) — só um `include` pra
# fora, apontando pro diretório docker/ inteiro montado como bind-mount
# (não como arquivo único: bind-mount de arquivo único fica desatualizado
# quando o arquivo é substituído por rename atômico — sed -i, editores, e
# `git checkout` fazem isso — porque o mount rastreia o INODE antigo, não
# o caminho. Bind-mount de DIRETÓRIO não tem esse problema). Resultado:
# `nginx -s reload` sozinho já basta pra aplicar qualquer mudança em
# proxy.conf, sem precisar recriar o container.
include /etc/nginx/host-docker/proxy.conf;
