version: "3.9"

# Nome do projeto fixo — evita depender do nome da pasta onde o repo está
# clonado. Já é "apienvios" hoje (nome real dos volumes já confirmado como
# apienvios_postgres_data etc.), então isso só torna explícito o que já era
# implícito, sem risco pros dados ao dividir em prod/dev.
name: ${PROJECT_NAME:-apienvios}

# Rede isolada para não interferir com o projeto casamento (casamento_default / r4net)
networks:
  apienvios_net:
    driver: bridge

services:
  # ── Banco de dados dedicado ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-apienvios}_postgres
    restart: unless-stopped
    networks:
      - apienvios_net
    environment:
      POSTGRES_USER: apienvios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: apienvios
    ports:
      - "${PG_PORT:-5433}:5432"   # 5432 ocupado pelo r4server (casamento)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apienvios"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache e filas ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-apienvios}_redis
    restart: unless-stopped
    networks:
      - apienvios_net
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Provider 1: Evolution API ───────────────────────────────
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: ${CONTAINER_PREFIX:-apienvios}_evolution
    restart: unless-stopped
    networks:
      - apienvios_net
    ports:
      - "${EVOLUTION_PORT:-8081}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://apienvios:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      QRCODE_LIMIT: 30
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Provider 2: WuzAPI (Go/whatsmeow, botões interativos) ───
  wuzapi:
    image: asternic/wuzapi:latest
    container_name: ${CONTAINER_PREFIX:-apienvios}_wuzapi
    restart: unless-stopped
    networks:
      - apienvios_net
    ports:
      - "${WUZAPI_PORT:-8082}:8080"
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      # Chaves fixas: sem elas o WuzAPI gera aleatórias no boot e PERDE todos os
      # tokens/sessões criptografados a cada restart do container.
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY}
      TZ: America/Sao_Paulo
    volumes:
      - wuzapi_data:/app/dbdata

  # ── Aplicação — SÓ EM DEV (container único, sem proxy) ────────────────────
  # Produção usa os slots app_blue/app_green + proxy mais abaixo — ver
  # COMPOSE_PROFILES no .env de cada pasta.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-apienvios}_app
    profiles: ["dev"]
    restart: unless-stopped
    networks:
      - apienvios_net
    ports:
      - "${APP_PORT:-3002}:3002"
    # Segredos vêm do .env local (gitignored) via ${VAR} — nada de valor real
    # fica hardcoded no arquivo versionado. docker-compose lê o .env desta
    # mesma pasta automaticamente pra resolver essas substituições.
    environment: &app_environment
      NODE_ENV: production
      PORT: 3002
      PUBLIC_BASE_URL: http://app:3002
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://dev-api.r4dev.com.br}
      API_SECRET: ${API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Endereços internos Docker (sobrepõem o .env)
      DATABASE_URL: postgresql://apienvios:${POSTGRES_PASSWORD}@postgres:5432/apienvios
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WUZAPI_URL: http://wuzapi:8080
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      WA_CLOUD_TOKEN: ${WA_CLOUD_TOKEN}
      WA_CLOUD_PHONE_NUMBER_ID: ${WA_CLOUD_PHONE_NUMBER_ID}
      WA_CLOUD_BUSINESS_ACCOUNT_ID: ${WA_CLOUD_BUSINESS_ACCOUNT_ID}
      BAN_WEBHOOK_URL: ${BAN_WEBHOOK_URL}
      ALERT_EMAIL: ${ALERT_EMAIL}
      SEND_DELAY_MIN: "2000"
      SEND_DELAY_MAX: "5000"
      MAX_MESSAGES_PER_NUMBER_DAY: "200"
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Proxy reverso (blue/green) — SÓ EM PRODUÇÃO ────────────────────────────
  # Fica no ar o tempo todo com o mesmo container; deploy troca só o arquivo
  # de upstream + `nginx -s reload` (gracioso, não derruba conexão nenhuma).
  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    image: ${CONTAINER_PREFIX:-apienvios}_proxy:latest
    container_name: ${CONTAINER_PREFIX:-apienvios}_proxy
    profiles: ["bluegreen"]
    restart: unless-stopped
    networks:
      apienvios_net:
        # "app" mantido por compatibilidade: instâncias já registradas nos
        # providers (Evolution/WuzAPI) guardam a URL de webhook como
        # http://app:3002/... (PUBLIC_BASE_URL, ver services/instance.service.ts)
        # — sem esse alias, essas instâncias antigas parariam de receber
        # mensagens inbound depois da virada pro blue/green.
        aliases:
          - app
    ports:
      - "${APP_PORT:-3002}:3002"
    volumes:
      - apienvios_proxy_state:/etc/nginx/active
      # Bind-mount do DIRETÓRIO (não do arquivo proxy.conf sozinho — bind-mount
      # de arquivo único fica desatualizado quando o arquivo é substituído
      # por rename atômico, ex. `git checkout`; o mount trava no inode
      # antigo. Diretório não tem esse problema).
      - ./docker:/etc/nginx/host-docker:ro
    depends_on:
      - app_blue
      - app_green

  # ── Slots blue/green ────────────────────────────────────────────────────
  # Nenhum dos dois publica porta pro host — só o proxy é alcançável de fora
  # (e dos outros containers do compose, via o alias "app").
  app_blue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IMAGE_TAG:-apienvios}:latest
    container_name: ${CONTAINER_PREFIX:-apienvios}_app_blue
    profiles: ["bluegreen"]
    restart: unless-stopped
    networks:
      - apienvios_net
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app_green:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IMAGE_TAG:-apienvios}:latest
    container_name: ${CONTAINER_PREFIX:-apienvios}_app_green
    profiles: ["bluegreen"]
    restart: unless-stopped
    networks:
      - apienvios_net
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  wuzapi_data:
  apienvios_proxy_state:
